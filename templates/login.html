<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MMOCDPAD-DRL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #cbd5e1;
        }
        body {
            background-color: var(--bg);
            color: var(--text-light);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 20px;
            padding: 3.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.15);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(15px);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glow-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }
        .top-left { top: -120px; left: -120px; }
        .bottom-right { bottom: -120px; right: -120px; }
        
        .form-label {
            color: var(--primary) !important;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
            font-size: 1rem;
        }
        .form-control {
            background: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: white !important;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            font-size: 1.1rem;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6) !important; /* Brighter placeholder */
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 1) !important;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }
        .input-group-text {
            color: var(--primary) !important;
            font-size: 1.2rem;
        }
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            padding: 1.2rem;
            border-radius: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 1rem;
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.6);
        }
        .brand-logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.2rem;
        }
        .subtitle {
            color: #f8fafc !important; /* Brightest white for subtitle */
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            opacity: 1 !important;
        }
        .footer-text {
            color: #cbd5e1 !important; /* Clearly visible grey */
            font-weight: 600;
            font-size: 0.75rem;
            margin-top: 2rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="glow-bg top-left"></div>
    <div class="glow-bg bottom-right"></div>

    <div class="login-card">
        <div class="text-center mb-5">
            <div class="brand-logo"><i class="fas fa-shield-alt me-2"></i>MMOCDPAD</div>
            <p class="subtitle mb-0">Zero Trust Security Gateway</p>
        </div>

        <form action="/login" method="POST">
            <div class="mb-4">
                <label class="form-label uppercase">Admin ID</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter Admin Username" required>
                </div>
            </div>
            <div class="mb-5">
                <label class="form-label uppercase">Security Key</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-key"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter Security Key" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Initialize Access</button>
            <div class="text-center">
                <p class="footer-text mb-0">Research Prototype v2.0 | High-Contrast Mode</p>
            </div>
        </form>
    </div>
</body>
</html>
